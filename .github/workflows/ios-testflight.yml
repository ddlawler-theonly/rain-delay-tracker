name: ios-testflight
# Builds ios-app/ (App Store build: starts empty, no preloaded job sites) and uploads to TestFlight ONLY (never submits for App Store review).
# Trigger: Actions › ios-testflight › Run workflow, or push a tag like ios-v1.0 (uploads) / ios-signcheck-N (sign check, no upload).
# Needs the repository secrets in ios-app/README-IOS.md (incl. DIST_CERT_P12_BASE64 + DIST_CERT_P12_PASSWORD).
on:
  workflow_dispatch:
    inputs:
      changelog:
        description: 'What to test (shown to testers)'
        required: false
  push:
    tags: ['ios-v*', 'ios-signcheck-*']   # ios-signcheck-*: build + sign + export only, NO upload

concurrency: { group: ios-testflight, cancel-in-progress: false }

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios-app
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
      DIST_CERT_P12_PASSWORD: ${{ secrets.DIST_CERT_P12_PASSWORD }}
      SKIP_UPLOAD: ${{ startsWith(github.ref, 'refs/tags/ios-signcheck-') && '1' || '' }}
      TESTFLIGHT_CHANGELOG: ${{ github.event.inputs.changelog }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets are set
        run: |
          for v in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY APPLE_TEAM_ID DIST_CERT_P12_BASE64 DIST_CERT_P12_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; exit 1; fi
          done
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ios-app/package-lock.json }
      - run: npm ci
      - name: App icons + splash (PNG, generated)
        run: npm run icons
      - name: Build store web bundle + cap sync ios
        run: npm run sync
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true, working-directory: ios-app }
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Build, sign and upload to TestFlight (sign check only on ios-signcheck-* tags)
        run: bundle exec fastlane ios beta
      - name: Keep the IPA
        if: success()
        uses: actions/upload-artifact@v4
        with: { name: RainDelay-ipa, path: ios-app/build/*.ipa, retention-days: 14 }
