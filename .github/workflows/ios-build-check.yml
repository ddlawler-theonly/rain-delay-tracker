name: ios-build-check
# Compile-only check of the App Store build (unsigned, iOS Simulator). Never signs, never uploads, never tags.
# Runs when ios-app/ changes on gh-pages, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths: ['ios-app/**', '.github/workflows/ios-build-check.yml']

concurrency: { group: ios-build-check, cancel-in-progress: true }

permissions: { contents: read }

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ios-app/package-lock.json }
      - run: npm ci
      - name: App icons + splash (PNG, generated)
        run: npm run icons
      - name: Build store web bundle + cap sync ios
        run: npm run sync
      - name: StoreKit config is valid JSON
        run: python3 -m json.tool ios/App/RainOut.storekit > /dev/null
      - name: Compile for iOS Simulator (unsigned, no upload)
        run: |
          if ! xcodebuild -project ios/App/App.xcodeproj -scheme App \
               -sdk iphonesimulator -configuration Debug \
               -destination 'generic/platform=iOS Simulator' \
               CODE_SIGNING_ALLOWED=NO build > build.log 2>&1; then
            echo "::group::errors"; grep -nE "error:|fatal" build.log | head -80; echo "::endgroup::"
            tail -n 80 build.log; exit 1
          fi
          grep -nE "warning:.*RainOutStoreKit" build.log | head -40 || true
          tail -n 5 build.log
